# Render Blueprint: https://render.com/docs/blueprint-spec
#
# The site is fully static: `npm run build` runs the client build, the SSR
# build and the prerender step, and leaves the finished site in dist/.
services:
  - type: web
    runtime: static
    name: 22yards-houston
    repo: https://github.com/geshnaakula10/22Yards
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    domains:
      - 22yardshouston.com
      - www.22yardshouston.com
    headers:
      # Vite output (JS, CSS, fonts) has content hashes in the file names.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Photos in public/images are not hashed, so keep them for a week.
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
